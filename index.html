<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beni Affettin Mi? 🥺❤️</title>
    <!-- Google Fontları -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <!-- Konfeti Efekti Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Arka Planda Uçan Üzgün & Kalp Kalbe Emojiler */
        .bg-heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.5);
            font-size: 24px;
            animation: floatUp 6s linear infinite;
            bottom: -50px;
            z-index: 1;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Ana Kart Tasarımı */
        .card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            max-width: 480px;
            width: 90%;
            position: relative;
            z-index: 10;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .emoji-icon {
            font-size: 70px;
            animation: bounce 2s infinite;
            display: inline-block;
            margin-bottom: 10px;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-15px); }
            60% { transform: translateY(-7px); }
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.2rem;
            color: #d6336c;
            margin-bottom: 15px;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.1);
        }

        p.subtitle {
            color: #555;
            font-size: 1rem;
            margin-bottom: 25px;
        }

        /* Buton Grubu */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background: #ffffff;
            color: #d6336c;
            border: none;
            padding: 16px 24px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            background: #fff0f5;
        }

        /* Kaçan Buton */
        .btn-no {
            background: rgba(255, 255, 255, 0.6);
            color: #777;
            position: relative;
        }

        /* Sonuç Ekranı */
        .result-screen {
            display: none;
        }

        .result-screen h2 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: #d6336c;
            margin-bottom: 15px;
        }

        .result-screen p {
            color: #444;
            font-size: 1.2rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- Arka Planda Uçuşan Emojiler -->
    <div id="hearts-container"></div>

    <!-- Soru Kartı -->
    <div class="card" id="mainCard">
        <div class="emoji-icon">🥺</div>
        <h1>Beni Affettin Mi?</h1>
        <p class="subtitle">Seni bir daha asla üzmeyeceğime söz veriyorum... 🌸</p>
        
        <div class="btn-group">
            <button class="btn" onclick="forgive('Evet! ❤️')">Evet! ❤️</button>
            <button class="btn" onclick="forgive('Çoktan Affettim 🥰')">Çoktan Affettim 🥰</button>
            <button class="btn" onclick="forgive('Zaten Kıyamam Ki! ✨')">Zaten Kıyamam Ki ✨</button>
            
            <!-- Kaçan Affetmedim Butonu -->
            <button class="btn btn-no" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">Affetmedim 😤</button>
        </div>
    </div>

    <!-- Affedince Açılacak Ekran -->
    <div class="card result-screen" id="resultCard">
        <div class="emoji-icon">💖</div>
        <h2>İyi Ki Varsın! ❤️</h2>
        <p>Beni affettiğin için çok teşekkürlerrr dm yaz yavrummmmmm ✨ 🌸</p>
    </div>

    <script>
        // Arka plan animasyonu
        function createHearts() {
            const container = document.getElementById('hearts-container');
            const icons = ['❤️', '🥺', '💕', '🌸', '✨'];
            
            setInterval(() => {
                const item = document.createElement('div');
                item.classList.add('bg-heart');
                item.innerText = icons[Math.floor(Math.random() * icons.length)];
                item.style.left = Math.random() * 100 + 'vw';
                item.style.animationDuration = (Math.random() * 3 + 3) + 's';
                item.style.fontSize = (Math.random() * 20 + 15) + 'px';
                
                container.appendChild(item);

                setTimeout(() => {
                    item.remove();
                }, 6000);
            }, 350);
        }

        // "Affetmedim" butonunu kaçırma işlevi
        function moveButton() {
            const btn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - btn.offsetWidth - 80);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight - 80);
            
            btn.style.position = 'fixed';
            btn.style.left = Math.max(20, x) + 'px';
            btn.style.top = Math.max(20, y) + 'px';
        }

        // Tıklandığında kutlama ve teşekkür mesajı
        function forgive(choiceText) {
            document.getElementById('mainCard').style.display = 'none';
            document.getElementById('resultCard').style.display = 'block';

            // Konfeti Yağmuru
            const duration = 4 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 1000 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        createHearts();
    </script>
</body>
</html>
